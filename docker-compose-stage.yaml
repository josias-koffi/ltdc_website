services:
    nextjs:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "3030:3000"
        volumes:
            - /app/node_modules
        environment:
            - NODE_ENV=development
        labels:
            - traefik.enable=true
            - traefik.http.routers.backend-app.rule=Host(`https://stage-ltdc.asso-ltdc.org`)
            - traefik.http.routers.backend-app.entrypoints=web
            - traefik.http.services.backend-app.loadbalancer.server.port=3030
#        command: next start
networks:
    dokploy-network:
        external: true
